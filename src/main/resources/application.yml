server:
  port: 8085
spring:
  application:
    name: eia-contract-expert
  datasource:
    url: jdbc:postgresql://localhost:5432/eia_contract
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
  sql:
    init:
      mode: always
management:
  endpoints:
    web:
      exposure:
        include: health,info

